services:
  php-fpm:
    build: docker/php-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - mailpit
  nginx:
    image: nginx:1.23.3-alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: easyappointments
      MYSQL_USER: user
      MYSQL_PASSWORD: ${A3_DB_PASSWORD:?defina a senha local}
      MYSQL_ROOT_PASSWORD: ${A3_ROOT_PASSWORD:?defina a senha root local}
    volumes:
      - a3_mysql:/var/lib/mysql
  mailpit:
    image: axllent/mailpit:v1.7
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  a3_mysql: