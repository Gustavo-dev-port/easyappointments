name: CI

# Roda em pull requests e em pushes na branch principal do trabalho (a3/base).
# O job "qualidade" é o quality gate: falha se algum teste quebrar ou se a
# cobertura do módulo crítico (Availability) ficar abaixo da meta.
on:
  push:
    branches: [ 'a3/base' ]
  pull_request:
    branches: [ 'a3/base' ]

env:
  # Meta de cobertura de linhas do Availability.php, em %.
  # Baseline medido: 24,91%. Etapa 1: não regredir (24). Meta final: decidida pelo grupo.
  META_COBERTURA_AVAILABILITY: "30"

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd
          coverage: xdebug

      # O TimezonesTest usa identificadores legados (ex.: Asia/Calcutta). O PHP do
      # runner usa o tzdata do Ubuntu, onde esses nomes ficam em tzdata-legacy.
      # O primeiro passo registra no log se o nome existe; o segundo instala o pacote.
      - name: Diagnóstico de fuso (identificadores legados)
        run: ls -l /usr/share/zoneinfo/Asia/Calcutta || echo "Asia/Calcutta ausente no runner"

      - name: Instalar tzdata-legacy
        run: sudo apt-get update && sudo apt-get install -y tzdata-legacy

      - name: Descobrir pasta de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create config file
        run: cp config-sample.php config.php

      - name: Regenerate autoload for tests
        run: composer dump-autoload --no-interaction

      - name: Run PHPUnit com cobertura
        run: |
          mkdir -p coverage
          vendor/bin/phpunit --configuration phpunit.xml \
            --coverage-filter application/libraries \
            --coverage-text \
            --coverage-clover coverage/clover.xml

      - name: Quality gate - cobertura do Availability
        run: python3 a3/ci/verificar_cobertura.py coverage/clover.xml Availability.php "$META_COBERTURA_AVAILABILITY"

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-clover
          path: coverage/clover.xml

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd

      - name: Install npm dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build
